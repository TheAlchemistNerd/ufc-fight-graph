name: Incremental UFC Crawl
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: incremental
        options: [incremental, events-only, fighters-only, backfill, full-reset]
permissions:
  contents: read
concurrency:
  group: ufc-crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USER: ${{ secrets.NEO4J_USER }}
      NEO4J_PASS: ${{ secrets.NEO4J_PASS }}
      NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Require persistent database configuration
        run: test -n "$NEO4J_URI" && test -n "$NEO4J_USER" && test -n "$NEO4J_PASS"
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: logs/crawl_checkpoint.json
          key: ufc-crawl-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ufc-crawl-v2-
      - name: Run crawl
        env:
          MODE: ${{ inputs.mode || 'incremental' }}
        run: |
          case "$MODE" in
            events-only) python run_crawl.py --events-only ;;
            fighters-only) python run_crawl.py --fighters-only ;;
            backfill) python run_backfill.py ;;
            full-reset) python run_crawl.py --reset ;;
            *) python run_crawl.py ;;
          esac
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: logs/crawl_checkpoint.json
          key: ufc-crawl-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Export graph backup
        if: always() && env.NEO4J_URI != ''
        run: python run_backup.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufc-graph-${{ github.run_number }}
          path: backups/*.zip
          retention-days: 30
