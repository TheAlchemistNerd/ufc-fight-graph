name: Build Dashboard Image
on:
  push:
    branches: [main]
    paths: &image_paths ['web/**', 'config/**', 'domain/**', 'infrastructure/**', 'data_access/**', 'run_*.py', 'requirements.txt', 'Dockerfile', '.dockerignore', '.github/workflows/deploy.yml']
  pull_request:
    branches: [main]
    paths: *image_paths
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke-test
        run: |
          docker build -t ufc-dashboard .
          docker run --rm ufc-dashboard python -c "import web.app; import run_crawl; import run_backup"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}/ufc-dashboard"
          docker tag ufc-dashboard "$IMAGE:latest"
          docker push "$IMAGE:latest"
